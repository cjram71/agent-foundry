model_list:
  - model_name: planner-fast
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: coder-strong
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: reviewer-independent
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: local-fallback
    litellm_params:
      model: ollama/deepseek-coder-v2:16b-lite-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
  - model_name: nvidia-worker
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: os.environ/NVIDIA_NIM_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false

# Provider/model names are configuration, not policy. Before production cutover,
# verify each alias against current provider availability and Gizmo evals.
