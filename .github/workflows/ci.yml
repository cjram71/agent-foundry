name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://foundry:foundry@127.0.0.1:5432/foundry
      - run: npm run build
      - run: npm run test --workspace=apps/runner
