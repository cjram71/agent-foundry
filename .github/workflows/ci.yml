name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://foundry:foundry@127.0.0.1:5432/foundry
      - name: Cold monorepo build
        run: npm run build
      - name: Dashboard production build
        run: npm run build --workspace=apps/dashboard
        env:
          DATABASE_URL: postgresql://foundry:foundry@127.0.0.1:5432/foundry
          REDIS_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-placeholder-secret-that-is-long-enough-for-validation-123456
      - name: Orchestrator tests
        run: npm test --workspace=apps/orchestrator
      - name: Runner tests
        run: npm test --workspace=apps/runner
      - name: GitHub adapter tests
        run: npm test --workspace=packages/github
      - name: Gizmo phase-gate PASS smoke test
        run: node scripts/gizmo-checkpoint-gate.js checkpoints/examples/phase-00-pass.example.json
      - name: Gizmo phase-gate rejects failed mandatory check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('checkpoints/examples/phase-00-pass.example.json', 'utf8'));
          source.checks[0].result = 'FAIL';
          fs.writeFileSync('/tmp/gizmo-checkpoint-fail.json', JSON.stringify(source));
          NODE
          if node scripts/gizmo-checkpoint-gate.js /tmp/gizmo-checkpoint-fail.json; then
            echo 'gate incorrectly accepted a failed mandatory check' >&2
            exit 1
          fi
