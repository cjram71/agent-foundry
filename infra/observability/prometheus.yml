global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gizmo-node
    static_configs:
      - targets: ['host.docker.internal:9100']
  - job_name: gizmo-cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: gizmo-prometheus
    static_configs:
      - targets: ['prometheus:9090']
