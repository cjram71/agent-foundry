name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://foundry:foundry@127.0.0.1:5432/foundry
      - name: Cold monorepo build
        run: npm run build
      - name: Dashboard production build
        run: npm run build --workspace=apps/dashboard
        env:
          DATABASE_URL: postgresql://foundry:foundry@127.0.0.1:5432/foundry
          REDIS_PASSWORD: ci-placeholder-password
          JWT_SECRET: ci-placeholder-secret-that-is-long-enough-for-validation-123456
      - name: Orchestrator tests
        run: npm test --workspace=apps/orchestrator
      - name: Runner tests
        run: npm test --workspace=apps/runner
      - name: GitHub adapter tests
        run: npm test --workspace=packages/github
      - name: Gizmo phase-gate PASS smoke test
        run: node scripts/gizmo-checkpoint-gate.js checkpoints/examples/phase-00-pass.example.json
      - name: Gizmo phase-gate rejects failed mandatory check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('checkpoints/examples/phase-00-pass.example.json', 'utf8'));
          source.checks[0].result = 'FAIL';
          fs.writeFileSync('/tmp/gizmo-checkpoint-fail.json', JSON.stringify(source));
          NODE
          if node scripts/gizmo-checkpoint-gate.js /tmp/gizmo-checkpoint-fail.json; then
            echo 'gate incorrectly accepted a failed mandatory check' >&2
            exit 1
          fi
      - name: Installer shell syntax
        run: bash -n scripts/gizmo-*.sh
      - name: Installer node syntax
        run: |
          node --check scripts/gizmo-checkpoint-gate.js
          node --check scripts/gizmo-verify-complete.js
      - name: Build manifest parses
        run: node -e "JSON.parse(require('fs').readFileSync('config/gizmo-build-manifest.json','utf8'))"
      - name: Auxiliary Compose renders with pinned CI placeholders
        env:
          N8N_IMAGE: n8nio/n8n:ci-pinned
          N8N_DB_PASSWORD: ci-password
          N8N_ENCRYPTION_KEY: ci-encryption-key-that-is-long-enough
          LITELLM_IMAGE: ghcr.io/berriai/litellm:ci-pinned
          LITELLM_MASTER_KEY: ci-litellm-key
          GRAFANA_IMAGE: grafana/grafana:ci-pinned
          PROMETHEUS_IMAGE: prom/prometheus:ci-pinned
          LOKI_IMAGE: grafana/loki:ci-pinned
          TEMPO_IMAGE: grafana/tempo:ci-pinned
          ALLOY_IMAGE: grafana/alloy:ci-pinned
          NODE_EXPORTER_IMAGE: prom/node-exporter:ci-pinned
          CADVISOR_IMAGE: gcr.io/cadvisor/cadvisor:ci-pinned
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose -f infra/compose/gizmo-services.yml config >/dev/null
      - name: Complete verifier must fail until runtime markers are certified
        run: |
          if node scripts/gizmo-verify-complete.js; then
            echo 'complete verifier incorrectly accepted uncertified runtime modules' >&2
            exit 1
          fi
