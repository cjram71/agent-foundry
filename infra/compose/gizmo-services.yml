services:
  n8n:
    image: ${N8N_IMAGE:?Set a pinned N8N_IMAGE}
    container_name: gizmo_n8n
    restart: unless-stopped
    ports:
      - "${N8N_BIND:-127.0.0.1:5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: host.docker.internal
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n_app}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Stockholm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

  litellm:
    image: ${LITELLM_IMAGE:?Set a pinned LITELLM_IMAGE}
    container_name: gizmo_litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_BIND:-127.0.0.1:4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set pinned PROMETHEUS_IMAGE}
    container_name: gizmo_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  grafana:
    image: ${GRAFANA_IMAGE:?Set pinned GRAFANA_IMAGE}
    container_name: gizmo_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  loki:
    image: ${LOKI_IMAGE:?Set pinned LOKI_IMAGE}
    container_name: gizmo_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  tempo:
    image: ${TEMPO_IMAGE:?Set pinned TEMPO_IMAGE}
    container_name: gizmo_tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  alloy:
    image: ${ALLOY_IMAGE:?Set pinned ALLOY_IMAGE}
    container_name: gizmo_alloy
    restart: unless-stopped
    volumes:
      - ../observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
    command: ["run", "/etc/alloy/config.alloy"]
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?Set pinned NODE_EXPORTER_IMAGE}
    container_name: gizmo_node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command: ["--web.listen-address=127.0.0.1:9100"]
    read_only: true
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ${CADVISOR_IMAGE:?Set pinned CADVISOR_IMAGE}
    container_name: gizmo_cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: false
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  n8n_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
